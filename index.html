<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, responsive dark-mode task management and file dashboard powered by Express and MongoDB.">
  <title>Task Management Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Task Creation Section -->
    <header class="creation-section">
      <div class="header-status-bar">
        <div id="api-status" class="api-status-badge connecting">
          <span class="status-dot"></span>
          <span class="status-label">Connecting to API...</span>
        </div>
      </div>

      <form id="task-form" class="task-form" novalidate>
        <div class="form-group">
          <label for="task-title" class="sr-only">Task Title</label>
          <input 
            type="text" 
            id="task-title" 
            name="title" 
            class="form-input title-input" 
            placeholder="Title goes here.." 
            autocomplete="off"
            aria-describedby="title-error"
          >
          <div id="title-error" class="validation-message" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <label for="task-desc" class="sr-only">Task Description</label>
          <textarea 
            id="task-desc" 
            name="description" 
            class="form-input desc-input" 
            placeholder="Write your task details here..." 
            rows="3"
            aria-describedby="desc-error"
          ></textarea>
          <div id="desc-error" class="validation-message" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-actions">
          <button type="submit" id="create-task-btn" class="btn btn-primary">
            Create Task
          </button>
        </div>
      </form>
    </header>

    <!-- Task / File Card Section -->
    <main class="dashboard-content">
      <section class="tasks-section" aria-label="Task Cards Grid">
        <div id="tasks-grid" class="tasks-grid">
          <!-- Dynamic Task Cards will be rendered here -->
        </div>

        <!-- Empty state message if all tasks are deleted -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">📋</div>
          <h2 class="empty-title">No tasks found</h2>
          <p class="empty-text">Create your first task or file card using the form above.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Read More Modal (Fetches full task from GET /api/tasks/:id) -->
  <div id="read-more-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-task-title">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-task-title" class="modal-title">Task Title</h2>
        <button type="button" class="btn-icon close-modal-btn" id="modal-close-icon" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-meta" id="modal-meta-info">
        <span class="meta-badge" id="modal-created-at">Loading...</span>
        <span class="meta-badge" id="modal-updated-at"></span>
      </div>

      <div class="modal-body">
        <div class="modal-description" id="modal-task-desc">
          <!-- Full task details text -->
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="modal-edit-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          Edit
        </button>
        <button type="button" class="btn btn-danger-outline" id="modal-delete-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Delete Task
        </button>
        <button type="button" class="btn btn-secondary" id="modal-close-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Edit Task Modal (Requirement 17: PUT /api/tasks/:id) -->
  <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <div class="modal-backdrop" id="edit-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="edit-modal-title" class="modal-title">Edit Task</h2>
        <button type="button" class="btn-icon close-modal-btn" id="edit-close-icon" aria-label="Close edit modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="edit-task-form" novalidate>
        <div class="modal-body">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="edit-title" class="form-label">Task Title</label>
            <input 
              type="text" 
              id="edit-title" 
              name="title" 
              class="form-input title-input" 
              placeholder="Task title..."
              required
            >
            <div id="edit-title-error" class="validation-message" role="alert"></div>
          </div>

          <div class="form-group">
            <label for="edit-desc" class="form-label">Task Details</label>
            <textarea 
              id="edit-desc" 
              name="description" 
              class="form-input desc-input" 
              placeholder="Task details..."
              rows="4"
              required
            ></textarea>
            <div id="edit-desc-error" class="validation-message" role="alert"></div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="edit-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-save-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal (Requirement 18: DELETE /api/tasks/:id) -->
  <div id="delete-confirm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="modal-backdrop" id="confirm-backdrop"></div>
    <div class="modal-dialog confirm-dialog">
      <div class="modal-header">
        <h2 id="confirm-modal-title" class="modal-title text-danger">Delete Confirmation</h2>
        <button type="button" class="btn-icon close-modal-btn" id="confirm-close-icon" aria-label="Cancel deletion">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <p class="confirm-message" id="confirm-message">
          Are you sure you want to delete this task? This action cannot be undone.
        </p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="confirm-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container for Success Messages -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
